<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Taxichurro Iquitos</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#000000"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Taxichurro">
<style>
:root{--t:#121212;--b:#2a2a2a;--l:#c6ff00;--r:#ff3b30;--g:#00e04b;--s:#9a9a9a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}*{box-sizing:border-box}
body{height:100%;margin:0;background:#000;color:#fff;font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column}
.scr{flex:1;overflow-y:auto;padding:12px 18px}
nav{display:flex;background:var(--t);border-top:1px solid var(--b)}
nav button{flex:1;background:none;border:0;color:var(--s);padding:12px 0;font-size:12px;font-family:inherit}nav button.on{color:var(--l);font-weight:700}
h2{margin:4px 0 10px;font-size:26px;font-weight:900}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.top>div.c{text-align:center}.lg{font-size:28px;font-weight:900}
.pill{display:inline-block;background:var(--l);color:#000;font-weight:900;font-size:12px;letter-spacing:2px;padding:2px 14px;border-radius:6px}
.ib{width:42px;height:42px;border-radius:50%;border:2px solid var(--l);background:var(--t);color:var(--l);font:900 18px Roboto,system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.card{background:var(--t);border:1px solid var(--b);border-radius:24px;padding:16px;margin-bottom:12px}
.sp{display:flex;justify-content:space-between;align-items:center}
.s{color:var(--s);font-size:13px}.m{font-size:26px;font-weight:900}
.hero{border-radius:28px;padding:18px 0 6px;text-align:center;background:linear-gradient(#16300b,#0b1a09 55%,#3c7a0b);margin-top:10px}
img.mt{width:100%;aspect-ratio:1.5;object-fit:cover;object-position:50% 56%;display:block}
.big{width:100%;height:64px;border:0;border-radius:20px;background:var(--l);color:#000;font:900 18px Roboto,system-ui,sans-serif}.big.red{background:var(--r);color:#fff}
.go{height:72px;display:flex;align-items:center;justify-content:center;gap:14px;font-size:21px;margin:14px 0}
.pl{width:44px;height:44px;border-radius:50%;background:#000;color:var(--l);display:inline-flex;align-items:center;justify-content:center;font-size:20px}.go.red .pl{color:var(--r)}
.ic{width:52px;height:52px;border-radius:14px;color:#000;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.li{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}.li .nn{width:28px;text-align:center;font-size:18px}.li .gr{flex:1}
input[type=text],input:not([type]){width:100%;background:#1e1e1e;border:1px solid var(--b);border-radius:14px;color:#fff;padding:12px;font-size:16px;margin-top:8px;font-family:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.chip{border:1px solid var(--b);background:var(--t);color:#fff;border-radius:50px;padding:8px 14px;font-size:14px;font-family:inherit}.chip.on{background:var(--l);color:#000;font-weight:700}
.ok{color:var(--l);font-weight:700}.er{color:var(--r);font-weight:700}
.lnk{background:none;border:0;font:700 14px Roboto,system-ui,sans-serif;padding:8px}
.mi{display:block;width:100%;text-align:left;background:#1e1e1e;border:0;border-radius:14px;color:#fff;padding:14px;margin-top:8px;font:600 16px Roboto,system-ui,sans-serif}
#bub{position:fixed;width:64px;height:64px;border-radius:50%;background:var(--g);border:3px solid #fff;z-index:20;touch-action:none;left:10px;top:42%;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 4px 14px #0008}
#bub img{width:48px;height:48px;object-fit:contain;pointer-events:none}
#mod{position:fixed;inset:0;background:#000a;z-index:30;display:none;align-items:flex-start;justify-content:center;padding-top:90px}
#mod>div{width:min(320px,92%);background:var(--t);border:2px solid var(--l);border-radius:24px;padding:20px;text-align:center}
#mod h3{margin:4px 0 10px;font-size:22px}#mod .pt{color:var(--l);font-weight:900;letter-spacing:3px;font-size:13px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#000;border-radius:14px;padding:12px 16px;z-index:40;display:none;max-width:90%;font-size:14px;font-weight:600}
.wa{background:#0b141a;min-height:100%}.wa .hd{background:#202c33;padding:14px;font-weight:700}
.msg{max-width:75%;padding:8px 12px;border-radius:12px;margin:8px 14px;font-size:14px;background:#202c33}.msg.me{background:#005c4b;margin-left:auto}
.ban{background:#ffd54f;color:#000;font-size:12px;padding:6px 10px;text-align:center}
.big.out{background:none;border:2px solid var(--l);color:var(--l);height:56px;margin-top:12px}.big.out.red{border-color:var(--r);color:var(--r);margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 4px}
.tile{background:#1e1e1e;border:1px solid var(--b);border-radius:18px;color:#fff;padding:12px 4px;font:600 13px Roboto,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:6px}.tile span{font-size:26px;line-height:1.1}
.tile.on{border-color:var(--l);background:#232b0a;color:var(--l)}
label.fl{display:block;margin-top:12px;font-weight:700;font-size:15px}
.hj{padding:6px 14px 14px;text-align:center}.hb{height:56px;background:#000;border:2px solid var(--l);color:var(--l)}.hb.red{border-color:var(--r);color:var(--r);margin-top:8px}
.big.dis{background:var(--b);color:var(--s)}.go.dis .pl{color:var(--s)}
.pw{display:flex;align-items:center;gap:12px;width:100%;height:60px;border-radius:30px;border:2px solid var(--s);background:#000;color:var(--s);padding:0 8px;margin-top:8px;font:900 18px Roboto,system-ui,sans-serif}
.pw .kn{width:44px;height:44px;border-radius:50%;background:var(--s);color:#000;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}.pw b{flex:1;text-align:center}
.pw.on{border-color:var(--l);color:var(--l);flex-direction:row-reverse}.pw.on .kn{background:var(--l)}
.big.sm{height:48px;font-size:16px;margin-top:0}
.sw{position:relative;display:block;width:172px;height:64px;margin:10px auto 8px;border:0;border-radius:32px;background:#4a4a4a;color:#fff;font:900 20px Roboto,system-ui,sans-serif}
.sw .kb{position:absolute;top:5px;left:5px;width:54px;height:54px;border-radius:50%;background:#fff;transition:left .2s}
.sw .lb{position:absolute;top:0;right:24px;height:100%;display:flex;align-items:center}
.sw.on{background:var(--l);color:#000}.sw.on .kb{left:113px;background:#000}.sw.on .lb{right:auto;left:24px}
.pwr{text-align:center;padding:10px 0 4px}.pbtn{background:none;border:0;padding:0;line-height:0;filter:drop-shadow(0 4px 8px #0009)}.pwr .s{color:#d6efb0;margin:8px 0 6px}
.scr{padding:10px 14px}
.hm{display:flex;flex-direction:column;min-height:100%;gap:8px}.hm>*{flex:none;margin:0!important}
.hm .lg{font-size:22px}.hm .pill{font-size:10px;padding:1px 10px}.hm .ib{width:36px;height:36px;font-size:16px}
.hm .hero{flex:1 1 150px;min-height:150px;padding:8px 0 4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden}
.hm .hero>div:first-child{font-size:17px!important}
.hm .pwr{padding:2px 0 0}.hm .pwr svg{width:64px;height:64px}.hm .pwr .s{margin:4px 0!important;font-size:12px}
.hm .hero img.mt{flex:1 1 0;min-height:0;width:100%;aspect-ratio:auto;object-fit:contain;object-position:center}
.hm .go{height:56px;font-size:19px}.hm .pl{width:36px;height:36px;font-size:16px}
.hm .card{padding:8px 14px;border-radius:20px}
.hm .ic{width:40px;height:40px;font-size:24px;border-radius:12px}
.hm .card .m{font-size:22px!important;line-height:1.1}.hm .card>.sp .s,.hm .card>div>div>.s{font-size:12px!important}
.hm .top .pbtn{width:48px;height:48px;padding:0;line-height:0;flex:none}.hm .top .pbtn svg{width:48px;height:48px}
</style></head><body><div id="app"><div class="scr" id="scr"></div><nav id="nav"></nav></div>

function stats(){const P=(n,t)=>{const x=tot(t),L=(a,b,c)=>`<div class="sp" style="margin:3px 0;color:${c||'#fff'}"><span>${a}</span><b>${b}</b></div>`;return `<div class="card"><b style="color:var(--l);font-size:18px">${n}</b><div style="margin-top:8px">${L('Ingresos',money(x.i))}${L('&nbsp;&nbsp;Carreras',money(x.ic),'var(--s)')}${L('&nbsp;&nbsp;Otros ingresos',money(x.ie),'var(--s)')}${L('Gastos',money(x.g))}${L('Número de carreras',x.n)}</div><div class="s" style="margin-top:8px">Ganancia neta</div><div class="m" style="font-size:34px;color:${x.net<0?'var(--r)':'var(--l)'}">${money(x.net)}</div></div>`};return `<h2>Estadísticas</h2>${P('Hoy',0)}${P('Esta semana (lunes a domingo)',1)}${P('Este mes',2)}`}
const PG={home:()=>'<div class="hm">'+home()+'</div>',car:carreras,gas:dinero,his:historial,est:stats,ing:ingreso},TABS=[['home','Inicio'],['his','Historial']];
function render(){
 $('#nav').innerHTML=TABS.map(([p,n])=>`<button class="${page==p?'on':''}" onclick="go('${p}')">${n}</button>`).join('');
 const st=$('#scr').scrollTop,back=(page=='est'||page=='ing')?`<button class="chip" onclick="go('home')">← Volver</button>`:'';
 $('#scr').innerHTML=back+PG[page]();$('#scr').scrollTop=st}
render();watch();setTimeout(completar,1500);

</script></body></html>
